[package]
name = "modelmux"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small local Responses router for Codex"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
futures-util = "0.3"
hex = "0.4"
http = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.47", features = ["full"] }
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.17", features = ["v4"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
