name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify macOS build
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked --all-targets

      - name: Test menu bar app
        run: swift test --package-path menubar

      - name: Build release CLI
        run: cargo build --locked --release

      - name: Package menu bar app
        run: menubar/package-app.sh release "" target/release/codexmux

      - name: Verify menu bar app
        run: |
          app="menubar/.build/release/CodexMux.app"
          test -x "$app/Contents/MacOS/CodexMux"
          test -x "$app/Contents/Resources/codexmux"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
